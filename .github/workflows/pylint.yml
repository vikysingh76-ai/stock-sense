name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is the floor: mcp_server/requirements.txt's `mcp` package
        # requires Python >=3.10, so anything older can't even install
        # dependencies (growwapi, also used here, only needs >=3.9, but
        # mcp is the stricter constraint since both files are installed).
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        # Install the app's own dependencies too, otherwise pylint can't
        # resolve third-party imports (streamlit, yfinance, etc.) and
        # reports every single one as a false-positive import-error.
        pip install -r requirements.txt
        pip install -r mcp_server/requirements.txt
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')
